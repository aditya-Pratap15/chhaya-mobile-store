<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chhaya Mobiles & Repairs — Certified Pre-Owned Phones & Precision Hardware Lab | Chitrakoot Dham</title>
    <meta name="description" content="Chhaya Mobiles — Chitrakoot Dham's premier smartphone retail & precision hardware repair lab at Sony Dharmshala, Kamta Nath Mandir Road. Same-day diagnostics, genuine certified pre-owned devices, screen & motherboard IC micro-soldering." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#1a56db',
              'primary-hover': '#1e40af',
              'primary-dark': '#003fb1',
              'primary-light': '#eff6ff',
              secondary: '#00687a',
              'secondary-cyan': '#06b6d4',
              accent: '#ff9800',
              surface: '#faf8ff',
              'surface-card': '#ffffff',
              'surface-low': '#f8fafc',
              'surface-border': '#e2e8f0',
              'surface-dark': '#0f172a',
              'text-main': '#0f172a',
              'text-muted': '#64748b',
              'badge-green': '#10b981',
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              body: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              inter: ['"Inter"', 'sans-serif'],
            },
            boxShadow: {
              'subtle': '0 2px 8px -2px rgba(0, 0, 0, 0.05), 0 1px 4px -1px rgba(0, 0, 0, 0.02)',
              'card': '0 10px 30px -10px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03)',
              'card-hover': '0 20px 40px -15px rgba(26, 86, 219, 0.12), 0 8px 16px -4px rgba(0, 0, 0, 0.04)',
              'glow': '0 0 25px -5px rgba(26, 86, 219, 0.35)',
            }
          }
        }
      }
    </script>
    <style>
      @layer base {
        html {
          scroll-behavior: smooth;
          -webkit-tap-highlight-color: transparent;
        }
        body {
          margin: 0;
          padding: 0;
          font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
          background-color: #f8fafc;
          color: #0f172a;
          overflow-x: hidden;
        }
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .glassmorphism {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .glassmorphism-dark {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      @keyframes marqueeSlider {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-50%, 0, 0); }
      }
      .animate-marquee {
        display: flex !important;
        width: max-content !important;
        animation: marqueeSlider 18s linear infinite !important;
        will-change: transform;
      }
      .animate-marquee:hover {
        animation-play-state: paused !important;
      }
      @keyframes boxBlink {
        0%, 100% {
          border-color: rgba(59, 130, 246, 0.5);
          box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
          background-color: #0b132b;
        }
        50% {
          border-color: rgba(245, 158, 11, 1);
          box-shadow: 0 0 16px 3px rgba(245, 158, 11, 0.55), inset 0 0 10px rgba(245, 158, 11, 0.25);
          background-color: #1e1b4b;
        }
      }
      .animate-box-blink {
        animation: boxBlink 1.3s ease-in-out infinite !important;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
